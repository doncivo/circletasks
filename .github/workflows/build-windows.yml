# Build et publication de l'app PC (PRD section 7, ADR 0006, story D-03 critères 10 et 11).
# Tag vX.Y.Z : build NSIS signé (clé updater), vérification de la signature, latest.json, publication sur circletasks-releases.
# Lancement manuel : build seul, installeur NON signé en artefact, jamais de publication.
# Le job publish ne tourne que sur un push de tag vX.Y.Z.
# Le tag iOS (ios-vX.Y.Z) est distinct et ne déclenche pas ce workflow.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  # Dépôt public des versions : déclaré une seule fois (doit rester aligné sur plugins.updater.endpoints).
  RELEASES_REPO: doncivo/circletasks-releases

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      sha256: ${{ steps.collect.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # La version du tag, de tauri.conf.json, de package.json et de Cargo.toml doit être identique.
      # Hors tag (lancement manuel), seule la cohérence des trois fichiers est vérifiée.
      - name: Vérifier les versions
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/release/check-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/release/check-version.mjs
          fi

      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Hors tag : cache lecture/écriture. Le dossier bundle est exclu (aucun .sig ni installeur résiduel).
      - name: Cache cargo
        if: github.ref_type != 'tag'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/release/bundle
          key: cargo-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-${{ runner.os }}-

      # Sur tag (build signé) : cache en lecture seule, clé exacte, sans restore-keys, jamais réécrit par ce build.
      - name: Cache cargo (lecture seule)
        if: github.ref_type == 'tag'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/release/bundle
          key: cargo-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      # Signature uniquement sur tag ET clé présente ; un lancement manuel produit toujours un installeur non signé.
      # createUpdaterArtifacts n'est pas dans tauri.conf.json (il exigerait la clé pour tout build local) : activé ici.
      # Les secrets ne sont exposés qu'à cette étape, par variables d'environnement (jamais affichées).
      # Limite inhérente : la clé est visible de tout le processus de compilation (build.rs, scripts npm, dépendances).
      - name: Compiler l'installeur NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Client OAuth Google « Application de bureau » (K-01), lu à la compilation par src-tauri/build.rs (option_env!).
          # Contrairement à la clé de signature, transmis aussi aux builds de branche : sans eux, l'installeur de test
          # affiche « Google non configuré ». Google déclare ce client non confidentiel ; la valeur est de toute façon
          # embarquée en clair dans l'exécutable livré. Uniquement cette étape : ni test, ni publication.
          CT_GOOGLE_CLIENT_ID: ${{ secrets.CT_GOOGLE_CLIENT_ID }}
          CT_GOOGLE_CLIENT_SECRET: ${{ secrets.CT_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
              echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent : un tag de version exige la signature."
              exit 1
            fi
            npx tauri build --ci --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::Lancement manuel : installeur non signé, pas de latest.json."
            npx tauri build --ci --bundles nsis
          fi

      - name: Rassembler installeur, signature et latest.json
        id: collect
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release/check-version.mjs)
          DIR=src-tauri/target/release/bundle/nsis
          EXE="CircleTasks_${VERSION}_x64-setup.exe"
          test -f "${DIR}/${EXE}" || { echo "::error::Installeur absent : ${DIR}/${EXE}"; ls -l "${DIR}" || true; exit 1; }
          rm -rf dist-release && mkdir dist-release
          cp "${DIR}/${EXE}" dist-release/
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test -f "${DIR}/${EXE}.sig" || { echo "::error::Signature .sig absente : createUpdaterArtifacts n'a rien produit."; exit 1; }
            cp "${DIR}/${EXE}.sig" dist-release/
            # Notes : section de CHANGELOG.md dont le titre « ## [X.Y.Z] » ou « ## X.Y.Z » correspond exactement.
            NOTES=""
            if [ -f CHANGELOG.md ]; then
              NOTES=$(awk -v v="${VERSION}" '
                /^## / {
                  if (found) exit
                  t = $0; sub(/^## +/, "", t); sub(/^\[/, "", t)
                  if (t == v || index(t, v "]") == 1 || index(t, v " ") == 1) { found = 1; next }
                }
                found { print }' CHANGELOG.md)
            fi
            [ -n "${NOTES}" ] || NOTES="CircleTasks ${VERSION}"
            BASE="https://github.com/${RELEASES_REPO}/releases/download/v${VERSION}"
            node scripts/release/make-latest-json.mjs "${VERSION}" "dist-release/${EXE}" "dist-release/${EXE}.sig" "${BASE}" "${NOTES}" > dist-release/latest.json
            cat dist-release/latest.json
            # Vérification hors ligne avec la clé publique de tauri.conf.json avant toute publication.
            node scripts/release/verify-signature.mjs "dist-release/${EXE}" "dist-release/${EXE}.sig" "${VERSION}"
            echo "sha256=$(sha256sum "dist-release/${EXE}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
          ls -l dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: CircleTasks-windows
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Publication : uniquement sur push de tag vX.Y.Z. L'environnement « releases » porte le secret
  # RELEASES_TOKEN, sans approbation manuelle (décision d'Ali du 2026-10-07, docs/decisions.md). Le secret RELEASES_TOKEN n'existe que dans cet environnement.
  publish:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: releases
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CircleTasks-windows
          path: dist-release

      # L'endpoint de l'updater (tauri.conf.json, plugins.updater.endpoints) est
      # https://github.com/doncivo/circletasks-releases/releases/latest/download/latest.json :
      # latest.json est donc joint à chaque release, et la release la plus récente est marquée « latest ».
      - name: Publier sur circletasks-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          EXPECTED_SHA256: ${{ needs.windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret RELEASES_TOKEN absent : publication impossible (les fichiers restent en artefact)."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXE="dist-release/CircleTasks_${VERSION}_x64-setup.exe"
          for f in "$EXE" "$EXE.sig" dist-release/latest.json; do
            test -f "$f" || { echo "::error::Fichier absent : $f"; ls -l dist-release; exit 1; }
          done
          # latest.json doit annoncer la version du tag, et l'installeur doit être celui vérifié par le job windows.
          ANNOUNCED=$(node -p "require('./dist-release/latest.json').version")
          [ "$ANNOUNCED" = "$VERSION" ] || { echo "::error::latest.json annonce ${ANNOUNCED}, le tag vaut ${VERSION}"; exit 1; }
          ACTUAL=$(sha256sum "$EXE" | cut -d' ' -f1)
          [ -n "${EXPECTED_SHA256:-}" ] && [ "$ACTUAL" = "$EXPECTED_SHA256" ] || { echo "::error::SHA-256 de l'installeur différent de celui vérifié"; exit 1; }
          NOTES=$(node -p "require('./dist-release/latest.json').notes")
          gh release create "$TAG" "$EXE" "$EXE.sig" dist-release/latest.json \
            --repo "$RELEASES_REPO" --title "CircleTasks ${VERSION}" --notes "$NOTES" --latest \
            || { gh release upload "$TAG" "$EXE" "$EXE.sig" dist-release/latest.json --repo "$RELEASES_REPO" --clobber \
                 && gh release edit "$TAG" --repo "$RELEASES_REPO" --latest; }
