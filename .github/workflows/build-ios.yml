# Build iPhone sans Mac (PRD section 7, ADR 0007).
# Déclenchement manuel ou sur tag ios-v* uniquement : les minutes macOS d'un dépôt privé coûtent 10 fois plus.
# Lancement sur une branche de lot (I-01) : gh workflow run build-ios.yml --ref <branche> -f publish=false.
# Publication seulement sur un tag ios-v* (push du tag, ou lancement manuel sur ce tag avec publish),
# avec l'environnement releases (sans approbation manuelle, décision d'Ali du 2026-10-07) ; jamais depuis une branche, même avec publish coché.
# L'IPA n'est pas signée : SideStore la signe sur l'iPhone avec l'Apple ID gratuit.
# Le tag iOS (ios-vX.Y.Z) est distinct du tag PC (vX.Y.Z) qui déclenche build-windows.yml.
name: Build iOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier l'IPA et source.json sur circletasks-releases (sur un tag ios-v* seulement ; environnement releases + secret RELEASES_TOKEN)"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Sur tag, la version de tauri.conf.json doit correspondre au tag (ios-vX.Y.Z).
      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "ios-v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${VERSION} de tauri.conf.json"
            exit 1
          fi

      - name: Rust stable et cible iOS
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branche stable au 2026-10-07)
        with:
          targets: aarch64-apple-ios

      # Le dossier target contient des binaires qui embarquent l'identifiant Google iOS (non confidentiel, dépôt privé) ;
      # le cache n'est lisible que par ce dépôt. Exclure les binaires finaux casserait la compilation incrémentale.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - run: npm ci

      # ADR 0011 §22 point 10 (Y-IOS-01) : le plugin folder-bookmark est dans la cible iOS et nulle part ailleurs ; aucun plugin PC dans la
      # cible iOS (ADR 0007). Résolution seulement (aucune compilation) : la cible Windows se résout aussi sur ce runner.
      - name: Dépendances des cibles iOS et Windows
        working-directory: src-tauri
        run: |
          ios=$(cargo tree --locked --target aarch64-apple-ios -e normal --prefix none)
          echo "$ios" | grep -q '^tauri-plugin-folder-bookmark ' || { echo "::error::tauri-plugin-folder-bookmark absent de la cible iOS"; exit 1; }
          for pc in tauri-plugin-single-instance tauri-plugin-autostart tauri-plugin-updater tauri-plugin-process tauri-plugin-opener tauri-plugin-dialog tauri-plugin-fs tauri-plugin-global-shortcut; do
            if echo "$ios" | grep -q "^$pc "; then echo "::error::plugin PC dans la cible iOS : $pc"; exit 1; fi
          done
          windows=$(cargo tree --locked --target x86_64-pc-windows-msvc -e normal --prefix none)
          if echo "$windows" | grep -q '^tauri-plugin-folder-bookmark '; then echo "::error::tauri-plugin-folder-bookmark dans la cible Windows"; exit 1; fi
          # ADR 0011 §23 point 1 (Y-IOS-02) : Trousseau par security-framework 3.7.0 (celle de keyring), utilisé directement par l'app.
          sf=$(cargo tree --locked --target aarch64-apple-ios -e normal -i security-framework@3.7.0 --prefix none)
          echo "$sf" | grep -q '^circletasks ' || { echo "::error::security-framework 3.7.0 n'est pas une dépendance directe de l'app iOS"; exit 1; }
          echo "$ios" | grep -q '^tauri-plugin-barcode-scanner ' || { echo "::error::tauri-plugin-barcode-scanner absent de la cible iOS"; exit 1; }
          # ADR 0008 §9 (K-TECH-01) : session d'authentification web de la connexion Google, cible iOS seulement.
          echo "$ios" | grep -q '^tauri-plugin-web-auth ' || { echo "::error::tauri-plugin-web-auth absent de la cible iOS"; exit 1; }
          if echo "$windows" | grep -q '^tauri-plugin-web-auth '; then echo "::error::tauri-plugin-web-auth dans la cible Windows"; exit 1; fi
          # ADR 0008 §10.4 (K-05) : Rappels Apple (EventKit), cible iOS seulement ; le PC ne les lit jamais.
          echo "$ios" | grep -q '^tauri-plugin-reminders ' || { echo "::error::tauri-plugin-reminders absent de la cible iOS"; exit 1; }
          if echo "$windows" | grep -q '^tauri-plugin-reminders '; then echo "::error::tauri-plugin-reminders dans la cible Windows"; exit 1; fi

      # Le projet Xcode (src-tauri/gen/apple) n'est pas versionné : il est régénéré à chaque build
      # depuis tauri.conf.json et src-tauri/Info.ios.plist.
      - name: Initialiser le projet iOS
        run: npx tauri ios init --ci

      # Plugins iOS (N-01, ADR 0012 avenant N1.9) : le plugin de notifications locales est compilé pour l'iPhone et JAMAIS pour le PC
      # (le PC n'envoie aucune notification de rappel). Échec explicite dans les deux sens.
      - name: Plugins iOS
        run: |
          set -euo pipefail
          cd src-tauri
          IOS=$(cargo tree --target aarch64-apple-ios -i tauri-plugin-notification 2>&1 || true)
          echo "$IOS"
          grep -q "tauri-plugin-notification v" <<<"$IOS" || { echo "::error::tauri-plugin-notification absent de la compilation iOS"; exit 1; }
          WIN=$(cargo tree --target x86_64-pc-windows-msvc -i tauri-plugin-notification 2>&1 || true)
          echo "$WIN"
          if grep -q "tauri-plugin-notification v" <<<"$WIN"; then echo "::error::tauri-plugin-notification présent dans la compilation Windows"; exit 1; fi
          # N-03 (ADR 0012 avenant N-03) : le plugin Swift des actions de notification (délégué, catégories, fichier des actions) est dans la
          # cible iPhone et JAMAIS dans la cible Windows.
          ACT=$(cargo tree --target aarch64-apple-ios -i tauri-plugin-notification-actions 2>&1 || true)
          echo "$ACT"
          grep -q "tauri-plugin-notification-actions v" <<<"$ACT" || { echo "::error::tauri-plugin-notification-actions absent de la compilation iOS"; exit 1; }
          WINACT=$(cargo tree --target x86_64-pc-windows-msvc -i tauri-plugin-notification-actions 2>&1 || true)
          echo "$WINACT"
          if grep -q "tauri-plugin-notification-actions v" <<<"$WINACT"; then echo "::error::tauri-plugin-notification-actions présent dans la compilation Windows"; exit 1; fi
          # Lot M (ADR 0013 §5) : Face ID (I-03, officiel épinglé), retour haptique (A-07, plugin local) et cache de confidentialité
          # (I-03, plugin local) : iPhone seulement. CAP-IOS-01 (ADR 0015 §4.4) : plugins Swift vision et speech, appelés par Rust seul, iPhone seulement.
          for CRATE in tauri-plugin-biometric tauri-plugin-ct-haptics tauri-plugin-privacy-shield tauri-plugin-vision tauri-plugin-speech; do
            IOS=$(cargo tree --target aarch64-apple-ios -i "$CRATE" 2>&1 || true)
            echo "$IOS"
            grep -q "$CRATE v" <<<"$IOS" || { echo "::error::$CRATE absent de la compilation iOS"; exit 1; }
            WIN=$(cargo tree --target x86_64-pc-windows-msvc -i "$CRATE" 2>&1 || true)
            if grep -q "$CRATE v" <<<"$WIN"; then echo "::error::$CRATE présent dans la compilation Windows"; exit 1; fi
          done
          # Lot F (FILES-IOS-01 critère 10, ADR 0009 avenant lot F A1) : plugin ct-files (Enregistrer dans Fichiers), iPhone seulement.
          FILES=$(cargo tree --target aarch64-apple-ios -i tauri-plugin-ct-files 2>&1 || true)
          echo "$FILES"
          grep -q "tauri-plugin-ct-files v" <<<"$FILES" || { echo "::error::tauri-plugin-ct-files absent de la compilation iOS"; exit 1; }
          WINFILES=$(cargo tree --target x86_64-pc-windows-msvc -i tauri-plugin-ct-files 2>&1 || true)
          if grep -q "tauri-plugin-ct-files v" <<<"$WINFILES"; then echo "::error::tauri-plugin-ct-files présent dans la compilation Windows"; exit 1; fi

      # Option officielle du CLI Tauri `--no-sign` (crates/tauri-cli/src/mobile/ios/build.rs, v2.12.1) :
      # `xcodebuild archive` avec CODE_SIGNING_ALLOWED=NO pendant que le CLI sert ses options à la phase
      # Xcode « Build Rust Code » (tauri ios xcode-script), puis Products/Applications/CircleTasks.app est
      # zippé en Payload/ dans gen/apple/build/arm64/CircleTasks.ipa. beforeBuildCommand (npm run build)
      # compile le front, embarqué dans le binaire Rust. Pourquoi ce choix : ADR 0007, avenant POC-01.
      # Client OAuth Google « iOS » (K-01), lu à la compilation par src-tauri/build.rs (BUILD_SECRETS).
      # Identifiant public (non confidentiel) ; jamais le secret du client de bureau ici. Uniquement cette étape.
      - name: Compiler l'IPA sans signature
        env:
          CT_GOOGLE_IOS_CLIENT_ID: ${{ secrets.CT_GOOGLE_IOS_CLIENT_ID }}
        run: npx tauri ios build --ci --no-sign --target aarch64

      - name: Vérifier et copier CircleTasks.ipa
        run: |
          set -euo pipefail
          SRC=src-tauri/gen/apple/build/arm64/CircleTasks.ipa
          test -f "$SRC" || { echo "::error::IPA absente : $SRC"; find src-tauri/gen/apple/build -maxdepth 3 || true; exit 1; }
          rm -rf ipa && mkdir -p ipa && cp "$SRC" ipa/CircleTasks.ipa
          ls -l ipa/CircleTasks.ipa
          CHECK="$RUNNER_TEMP/check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          unzip -q ipa/CircleTasks.ipa -d "$CHECK"
          APP="$CHECK/Payload/CircleTasks.app"
          test -d "$APP" || { echo "::error::Payload/CircleTasks.app absent"; find "$CHECK" -maxdepth 3; exit 1; }
          PB=/usr/libexec/PlistBuddy
          ID=$($PB -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          MIN=$($PB -c "Print :MinimumOSVersion" "$APP/Info.plist")
          EXE=$($PB -c "Print :CFBundleExecutable" "$APP/Info.plist")
          VER=$($PB -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "Bundle ${ID}, version ${VER}, iOS minimum ${MIN}, exécutable ${EXE}"
          [ "$ID" = "fr.circletasks.planner" ] || { echo "::error::Bundle id inattendu : $ID"; exit 1; }
          case "$MIN" in 18|18.0) ;; *) echo "::error::MinimumOSVersion inattendu : $MIN"; exit 1;; esac
          ARCHS=$(lipo -archs "$APP/$EXE")
          echo "Architectures : $ARCHS"
          echo "$ARCHS" | grep -qw arm64 || { echo "::error::binaire arm64 absent"; exit 1; }
          # Le front est embarqué (compressé) dans le binaire ; ses chemins d'assets y figurent en clair.
          ASSET=$(cd dist && ls assets/*.js | head -n 1)
          grep -q "/index.html" "$APP/$EXE" || { echo "::error::index.html non embarqué"; exit 1; }
          grep -q "/${ASSET}" "$APP/$EXE" || { echo "::error::${ASSET} non embarqué"; exit 1; }
          echo "Front embarqué : /index.html et /${ASSET} présents"
          du -sh "$APP" "$APP/$EXE"
          ls "$APP"

      # Contrat des permissions (I-01) : chaque plugin déclare ses clés dans scripts/ios/plist-contract.json.
      # Le Info.plist de l'IPA est binaire : converti en XML, gardé en artefact pour source.json (appPermissions).
      - name: Contrat des permissions Info.plist
        run: |
          set -euo pipefail
          rm -rf info && mkdir -p info
          plutil -convert xml1 -o info/Info.plist "$RUNNER_TEMP/check/Payload/CircleTasks.app/Info.plist"
          node scripts/ios/check-plist-contract.mjs scripts/ios/plist-contract.json info/Info.plist
          PB=/usr/libexec/PlistBuddy
          USAGES=$( (grep -o '<key>NS[A-Za-z]*UsageDescription</key>' info/Info.plist || true) | sed 's/<[^>]*>//g' | tr '\n' ' ')
          {
            echo "### IPA CircleTasks (${GITHUB_REF_NAME})"
            echo ""
            echo "- Taille : $(stat -f%z ipa/CircleTasks.ipa) octets"
            echo "- SHA-256 : $(shasum -a 256 ipa/CircleTasks.ipa | cut -d' ' -f1)"
            echo "- Version : $($PB -c 'Print :CFBundleShortVersionString' info/Info.plist) ($($PB -c 'Print :CFBundleVersion' info/Info.plist))"
            echo "- Descriptions d'usage : ${USAGES:-aucune}"
            # I-02 (ADR 0013 §3.1) : information seulement. Une IPA non signée n'a pas de profil ; SideStore écrit embedded.mobileprovision
            # (profil de 7 jours) à l'installation, et la commande app_signing_info le lit sur l'appareil (contrôle A1 de la fiche I-02).
            if [ -f "$RUNNER_TEMP/check/Payload/CircleTasks.app/embedded.mobileprovision" ]; then echo "- embedded.mobileprovision : présent dans l'IPA"; else echo "- embedded.mobileprovision : absent de l'IPA (normal pour une IPA non signée ; SideStore l'écrit à l'installation, I-02)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ADR 0008 §9.3 (K-TECH-01) : l'ID client Google de type iOS est-il compilé dans le binaire de l'IPA ? Résultat réduit à présent / absent :
      # la valeur n'est ni affichée ni gardée. Absent : avertissement et ligne du résumé (jamais un échec : l'app affiche alors « non configuré »).
      - name: ID client Google iOS compilé
        run: |
          set -euo pipefail
          PB=/usr/libexec/PlistBuddy
          APP="$RUNNER_TEMP/check/Payload/CircleTasks.app"
          EXE=$($PB -c "Print :CFBundleExecutable" "$APP/Info.plist")
          if grep -aEq '[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com' "$APP/$EXE"; then
            STATE="présent"
          else
            STATE="absent"
            echo "::warning::ID client Google iOS absent de l'IPA : la connexion à Google affichera « non configuré » (secret du dépôt à renseigner)"
          fi
          echo "- ID client Google iOS compilé : ${STATE}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: CircleTasks-ipa
          path: ipa/CircleTasks.ipa
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CircleTasks-info-plist
          path: info/Info.plist
          if-no-files-found: error
          retention-days: 30

      # Les journaux Xcode peuvent répéter l'environnement du build : toute ligne CT_GOOGLE est supprimée avant l'envoi.
      - name: Filtrer les journaux de compilation
        if: failure()
        run: find src-tauri/gen/apple -type f \( -name '*.log' -o -name project.yml \) -exec sed -i '' '/CT_GOOGLE/d' {} +

      - name: Journaux de compilation en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-logs
          path: |
            src-tauri/gen/apple/build/**/*.log
            src-tauri/gen/apple/project.yml
          if-no-files-found: ignore

  # Publication : tag ios-v* seulement (push du tag, ou lancement manuel sur le tag avec publish).
  # Une branche n'est jamais publiée, même avec publish coché (I-01). L'environnement « releases »
  # porte RELEASES_TOKEN, sans approbation manuelle (décision d'Ali du 2026-10-07).
  publish:
    needs: ios
    if: startsWith(github.ref, 'refs/tags/ios-v') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment: releases
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: CircleTasks-ipa
          path: ipa

      - uses: actions/download-artifact@v4
        with:
          name: CircleTasks-info-plist
          path: info

      - name: Publier sur circletasks-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          # Seconde barrière, indépendante de la condition du job : jamais de publication hors tag ios-v*.
          case "${GITHUB_REF}" in refs/tags/ios-v*) ;; *) echo "::error::Publication refusée hors tag ios-v* (${GITHUB_REF})"; exit 1;; esac
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret RELEASES_TOKEN absent : publication impossible (l'IPA reste en artefact)."
            exit 1
          fi
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="ios-v${VERSION}"
          if [ "${TAG}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${VERSION}"
            exit 1
          fi
          REPO="doncivo/circletasks-releases"
          IPA_URL="https://github.com/${REPO}/releases/download/${TAG}/CircleTasks.ipa"
          NOTES="CircleTasks ${VERSION}"
          # Le jeton passe par le credential helper de gh, jamais dans l'URL ni dans .git/config.
          gh auth setup-git
          git clone "https://github.com/${REPO}.git" releases
          node scripts/ios/make-source-json.mjs --version "$VERSION" --ipa ipa/CircleTasks.ipa --info-plist info/Info.plist \
            --url "$IPA_URL" --notes "$NOTES" --existing releases/source.json > source.new.json
          gh release create "$TAG" ipa/CircleTasks.ipa --repo "$REPO" --title "CircleTasks iPhone ${VERSION}" --notes "$NOTES" --latest=false \
            || gh release upload "$TAG" ipa/CircleTasks.ipa --repo "$REPO" --clobber
          cp source.new.json releases/source.json
          # iconURL est obligatoire pour SideStore (StoreApp.swift) : icône servie par le dépôt public.
          cp src-tauri/icons/icon.png releases/icon.png
          cd releases
          git config user.name "circletasks-ci"
          git config user.email "ci@users.noreply.github.com"
          git add source.json icon.png
          git commit -m "source.json: iPhone ${VERSION}" || echo "Rien à valider"
          # Le dépôt public a pu bouger depuis le clone (publication PC) : rebase avant le push,
          # une seule nouvelle tentative si le push est refusé, sinon échec visible du job.
          git pull --rebase
          if ! git push; then
            echo "::warning::Push de source.json refusé, nouvelle tentative après rebase."
            if ! { git pull --rebase && git push; }; then
              echo "::error::Push de source.json impossible : l'IPA est publiée mais la source SideStore n'est pas à jour. Relancer la publication."
              exit 1
            fi
          fi
