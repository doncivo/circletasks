name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Lancer aussi les tests Playwright (e2e)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
        env:
          CT_TEST_WORKERS: "2"

  # Audit des dépendances Rust (base RustSec) : étape séparée, un échec n'empêche pas les autres vérifications.
  audit-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RUSTSEC-2023-0071 (rsa, attaque Marvin, aucun correctif publié) : rsa n'est présent dans Cargo.lock que par sqlx-mysql,
      # que tauri-plugin-sql (fonction « sqlite » seule) ne compile jamais. L'exception tient tant que l'étape suivante le prouve :
      # si rsa entre un jour dans le graphe compilé, quelle que soit la cible, le job échoue.
      - name: rsa jamais compilé
        working-directory: src-tauri
        run: |
          out="$(cargo tree --locked -i rsa --target all -e normal,build)"
          if [ -n "$out" ]; then echo "rsa est compilé : retirer l'exception RUSTSEC-2023-0071"; echo "$out"; exit 1; fi
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071

  # Tests Rust du PC (cargo test, exécutable tests/desktop) : seulement si src-tauri/ change (ou lancement manuel). Le passage en
  # --release (URL du serveur Vite refusée hors debug pour la fenêtre pairing, ADR 0011 section 2.1) seulement sur main et à la demande.
  # Cache des dépendances seulement (rust-cache), sauvegardé seulement depuis main.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fichiers Rust modifiés ?
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD -- src-tauri | grep -q .; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust stable
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Cache des dépendances Rust
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        if: steps.changes.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo test --locked --features test-hooks --test desktop
      - name: cargo test --release (fenêtre pairing)
        if: steps.changes.outputs.rust == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        working-directory: src-tauri
        run: cargo test --locked --release --features test-hooks --test desktop sync_pairing

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
