name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Lancer aussi les tests Playwright (e2e)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
        env:
          CT_TEST_WORKERS: "2"

  # Audit des dépendances Rust (base RustSec) : étape séparée, un échec n'empêche pas les autres vérifications.
  audit-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RUSTSEC-2023-0071 (rsa, attaque Marvin, aucun correctif publié) : rsa n'est présent dans Cargo.lock que par sqlx-mysql,
      # que tauri-plugin-sql (fonction « sqlite » seule) ne compile jamais. L'exception tient tant que l'étape suivante le prouve :
      # si rsa entre un jour dans le graphe compilé, quelle que soit la cible, le job échoue.
      - name: rsa jamais compilé
        working-directory: src-tauri
        run: |
          out="$(cargo tree --locked -i rsa --target all -e normal,build)"
          if [ -n "$out" ]; then echo "rsa est compilé : retirer l'exception RUSTSEC-2023-0071"; echo "$out"; exit 1; fi
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
