name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Lancer aussi les tests Playwright (e2e)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
        env:
          CT_TEST_WORKERS: "2"

  # Audit des dépendances Rust (base RustSec) : étape séparée, un échec n'empêche pas les autres vérifications.
  audit-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  # Tests Rust du PC (cargo test, exécutable tests/desktop) : aucun job ne les lançait. Le second passage en --release vérifie que
  # l'URL du serveur Vite est refusée hors debug pour la fenêtre pairing (ADR 0011 section 2.1, revue 8 du lot Y1).
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-tests-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-tests-windows-${{ runner.os }}-
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --test desktop
      - name: cargo test --release (fenêtre pairing)
        working-directory: src-tauri
        run: cargo test --locked --release --test desktop sync_pairing

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
