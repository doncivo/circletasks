name: Tests

# Suite complète de CircleTasks, exécutée sur GitHub Actions (dépôt public : minutes gratuites) et non plus en local.
# Jobs parallèles ; le job « suite-verte » dépend de tous les autres et sert de statut requis.
# Pas de build iOS ni Windows ici (build-ios.yml en lancement manuel, build-windows.yml sur tag). Aucun secret transmis.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche annule le run précédent. Sur main, le SHA fait partie du groupe : aucun commit de main n'est
# jamais annulé avant d'avoir été testé. L'événement fait partie du groupe : push, pull_request et lancement manuel ne s'annulent pas entre eux.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  CI_COUNTS: ${{ github.workspace }}/counts

jobs:
  qualite:
    name: Lint et typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  # Vitest : projet node en 5 tranches (2 workers : les simulations de synchro à trois appareils sont sensibles à la charge, 4 workers sur 4 cœurs les faisaient dépasser leur délai), projet dom en 3 tranches. Chaque tranche écrit un rapport blob (avec sa couverture) ;
  # le job vitest-couverture les fusionne et contrôle les seuils sur le résultat fusionné (CT_COVERAGE_SHARD retire les seuils des tranches).
  vitest-node:
    name: Vitest node (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      CT_COVERAGE_SHARD: "1"
      CT_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest projet node, tranche ${{ matrix.shard }}/5
        run: >
          npx vitest run --project node --shard=${{ matrix.shard }}/5
          --reporter=default --reporter=blob --outputFile.blob=.vitest/blob/blob-node-${{ matrix.shard }}.json
          --reporter=json --outputFile.json=vitest-report.json
      - name: Comptage
        if: ${{ !cancelled() && hashFiles('vitest-report.json') != '' }}
        run: |
          mkdir -p "$CI_COUNTS"
          node scripts/ci/test-counts.mjs write vitest vitest-report.json "$CI_COUNTS/vitest-node-${{ matrix.shard }}.json" "Vitest node"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: blob-node-${{ matrix.shard }}
          path: .vitest/blob/
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: count-vitest-node-${{ matrix.shard }}
          path: counts/
          if-no-files-found: ignore
          retention-days: 1

  vitest-dom:
    name: Vitest dom (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CT_COVERAGE_SHARD: "1"
      CT_TEST_WORKERS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest projet dom, tranche ${{ matrix.shard }}/3
        run: >
          npx vitest run --project dom --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=blob --outputFile.blob=.vitest/blob/blob-dom-${{ matrix.shard }}.json
          --reporter=json --outputFile.json=vitest-report.json
      - name: Comptage
        if: ${{ !cancelled() && hashFiles('vitest-report.json') != '' }}
        run: |
          mkdir -p "$CI_COUNTS"
          node scripts/ci/test-counts.mjs write vitest vitest-report.json "$CI_COUNTS/vitest-dom-${{ matrix.shard }}.json" "Vitest dom"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: blob-dom-${{ matrix.shard }}
          path: .vitest/blob/
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: count-vitest-dom-${{ matrix.shard }}
          path: counts/
          if-no-files-found: ignore
          retention-days: 1

  vitest-couverture:
    name: Couverture fusionnée
    needs: [vitest-node, vitest-dom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-*
          path: .vitest/blob
          merge-multiple: true
      # Seuils de vitest.config.ts (src/domain : 80 %) contrôlés ici, sur la fusion des huit tranches.
      - name: Fusion des rapports et seuils de couverture
        run: |
          n=$(ls .vitest/blob/*.json 2>/dev/null | wc -l)
          if [ "$n" -ne 8 ]; then echo "::error::$n rapports blob au lieu de 8 (5 tranches node + 3 tranches dom) : fusion refusée"; ls -la .vitest/blob || true; exit 1; fi
          npx vitest run --merge-reports --reporter=default
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: couverture-html
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # Tests Rust du PC : Windows exigé (manifeste comctl32 v6, windows-test.manifest, lié par build.rs aux seuls exécutables de test).
  # --features test-hooks, exécutable tests/desktop ; les tests tournent avec les fils par défaut (aucun --test-threads imposé).
  # Le passage en --release (URL du serveur Vite refusée hors debug pour la fenêtre pairing, ADR 0011 section 2.1) seulement sur main et à la demande.
  cargo-test:
    name: cargo test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Cache des dépendances Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        shell: bash
        working-directory: src-tauri
        run: cargo test --locked --features test-hooks --test desktop 2>&1 | tee "$RUNNER_TEMP/cargo.log"
      # 0.2.2 : pool SQLite à une connexion (src-tauri/vendor/tauri-plugin-sql). Le test échoue sur le pool d'origine (code 5).
      - name: cargo test (pool SQLite à une connexion)
        shell: bash
        working-directory: src-tauri
        run: cargo test --locked -p tauri-plugin-sql --features sqlite
      - name: cargo test --release (fenêtre pairing)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        working-directory: src-tauri
        run: cargo test --locked --release --features test-hooks --test desktop sync_pairing 2>&1 | tee "$RUNNER_TEMP/cargo-release.log"
      - name: Comptage
        if: ${{ !cancelled() && hashFiles('src-tauri/Cargo.toml') != '' }}
        shell: bash
        run: |
          mkdir -p "$CI_COUNTS"
          if [ -f "$RUNNER_TEMP/cargo.log" ]; then node scripts/ci/test-counts.mjs write cargo "$RUNNER_TEMP/cargo.log" "$CI_COUNTS/cargo.json" "cargo test"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: count-cargo
          path: counts/
          if-no-files-found: ignore
          retention-days: 1

  # Audit des dépendances Rust (base RustSec).
  audit-rust:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # RUSTSEC-2023-0071 (rsa, attaque Marvin, aucun correctif publié) : rsa n'est présent dans Cargo.lock que par sqlx-mysql,
      # que tauri-plugin-sql (fonction « sqlite » seule) ne compile jamais. L'exception tient tant que l'étape suivante le prouve :
      # si rsa entre un jour dans le graphe compilé, quelle que soit la cible, le job échoue.
      - name: rsa jamais compilé
        working-directory: src-tauri
        run: |
          out="$(cargo tree --locked -i rsa --target all -e normal,build)"
          if [ -n "$out" ]; then echo "rsa est compilé : retirer l'exception RUSTSEC-2023-0071"; echo "$out"; exit 1; fi
      # Clé mensuelle : cargo-audit est réinstallé (dernière version) au plus une fois par mois.
      - name: Mois courant
        id: mois
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache de cargo-audit
        id: cache-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.mois.outputs.mois }}
      - name: Installer cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071

  # Playwright : projet pc en 4 tranches, projet iphone en 4 tranches (Chromium en émulation mobile).
  e2e:
    name: e2e ${{ matrix.project }} (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [pc, iphone]
        shard: [1, 2, 3, 4]
    env:
      CT_TEST_WORKERS: "4"
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-report.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Installer Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dépendances système de Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright projet ${{ matrix.project }}, tranche ${{ matrix.shard }}/4
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --reporter=github,html,json
      - name: Comptage
        if: ${{ !cancelled() && hashFiles('playwright-report.json') != '' }}
        run: |
          mkdir -p "$CI_COUNTS"
          node scripts/ci/test-counts.mjs write playwright playwright-report.json "$CI_COUNTS/e2e-${{ matrix.project }}-${{ matrix.shard }}.json" "e2e ${{ matrix.project }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: count-e2e-${{ matrix.project }}-${{ matrix.shard }}
          path: counts/
          if-no-files-found: ignore
          retention-days: 1

  # Playwright WebKit (moteur de la WebView iOS) : contrôles de mise en page de l'iPhone (titres sur une ligne, IOS-titres) sur le
  # build de production avec accroches de test (playwright.config.ts, CT_E2E_WEBKIT=1). ADR 0002 : WebKit ajouté après l'écart de 0.2.3.
  e2e-webkit:
    name: e2e iphone-webkit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CT_E2E_WEBKIT: "1"
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-report.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache de WebKit (Playwright)
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # CI-WEBKIT-01 : les paquets système de WebKit (187 .deb, 117 Mo) étaient retéléchargés du miroir Ubuntu à chaque run ; trois fois
      # le 27 octobre 2026 le miroir a traîné et le job a été annulé à 20 min avant tout test. Les .deb sont conservés dans un cache
      # (clé : système de l'image, liste des paquets demandés par Playwright et semaine ISO ; la version de l'image n'y figure pas, elle
      # change d'un runner à l'autre le même jour), recopiés dans le cache d'apt avant l'installation ; apt les
      # réutilise sans téléchargement quand l'index les confirme et ne retélécharge que les paquets mis à jour entre-temps. L'étape porte
      # son propre délai (8 min ; nominal 26 à 67 s à miroir normal, 305 s observés deux fois à miroir lent) pour échouer vite au lieu
      # de consommer les 20 min du job ; ce délai ne porte sur aucun test. Les .deb téléchargés sont sauvegardés même si l'étape échoue ou
      # expire (restore et save séparés, save toujours exécuté) : chaque tentative enrichit le cache, la relance repart de ce qui est déjà
      # reçu. Mesure avant / après dans docs/stories/CI-WEBKIT-01.md.
      - name: Clé du cache des paquets système de WebKit
        id: webkit-deps-key
        run: |
          echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"
          echo "pkgs=$(npx playwright install-deps --dry-run webkit | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "semaine=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restauration des paquets système de WebKit (.deb)
        id: apt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ct-apt-webkit
          key: apt-webkit-${{ steps.webkit-deps-key.outputs.image }}-${{ steps.webkit-deps-key.outputs.pkgs }}-${{ steps.webkit-deps-key.outputs.semaine }}
          restore-keys: |
            apt-webkit-${{ steps.webkit-deps-key.outputs.image }}-${{ steps.webkit-deps-key.outputs.pkgs }}-
            apt-webkit-${{ steps.webkit-deps-key.outputs.image }}-
      - name: Dépendances système de WebKit
        timeout-minutes: 8
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99ct-keep-debs > /dev/null
          if ls ~/.cache/ct-apt-webkit/*.deb > /dev/null 2>&1; then
            sudo cp ~/.cache/ct-apt-webkit/*.deb /var/cache/apt/archives/
            echo "Paquets .deb restaurés du cache : $(ls ~/.cache/ct-apt-webkit/*.deb | wc -l)"
          else
            echo "Aucun paquet .deb en cache : téléchargement depuis le miroir"
          fi
          debut=$(date +%s)
          npx playwright install-deps webkit
          echo "Installation des dépendances système de WebKit : $(( $(date +%s) - debut )) s"
      - name: Conservation des .deb téléchargés
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/ct-apt-webkit
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/ct-apt-webkit/ {} +
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/ct-apt-webkit
          echo "Paquets .deb conservés pour le cache : $(ls ~/.cache/ct-apt-webkit/*.deb 2>/dev/null | wc -l)"
      - name: Sauvegarde des paquets système de WebKit (.deb)
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ct-apt-webkit
          key: apt-webkit-${{ steps.webkit-deps-key.outputs.image }}-${{ steps.webkit-deps-key.outputs.pkgs }}-${{ steps.webkit-deps-key.outputs.semaine }}
      - name: Installer WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - name: Playwright projet iphone-webkit
        run: npx playwright test --project=iphone-webkit --reporter=github,html,json
      - name: Comptage
        if: ${{ !cancelled() && hashFiles('playwright-report.json') != '' }}
        run: |
          mkdir -p "$CI_COUNTS"
          node scripts/ci/test-counts.mjs write playwright playwright-report.json "$CI_COUNTS/e2e-iphone-webkit.json" "e2e iphone-webkit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-iphone-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: count-e2e-iphone-webkit
          path: counts/
          if-no-files-found: ignore
          retention-days: 1

  # Mesures de performance (budgets en ms, PRD section 8) : un job à part, sans autre charge sur la machine.
  # Les étapes s'enchaînent même après un échec pour que toutes les mesures soient visibles.
  perf:
    name: Performance et bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-report.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Installer Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dépendances système de Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Perf e2e
        env:
          # Projet perf et son build de production (second serveur) : définis seulement avec cette variable (playwright.config.ts).
          CT_E2E_PERF: "1"
        run: npx playwright test --project=perf --no-deps --reporter=github,html,json
      - name: Perf Vitest
        if: ${{ !cancelled() }}
        run: npm run test:perf -- --reporter=default --reporter=json --outputFile.json=vitest-perf.json
      - name: Taille du bundle
        if: ${{ !cancelled() }}
        run: npm run test:bundle
      - name: Comptage
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$CI_COUNTS"
          if [ -f playwright-report.json ]; then node scripts/ci/test-counts.mjs write playwright playwright-report.json "$CI_COUNTS/perf-e2e.json" "perf e2e"; fi
          if [ -f vitest-perf.json ]; then node scripts/ci/test-counts.mjs write vitest vitest-perf.json "$CI_COUNTS/perf-vitest.json" "perf Vitest"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-perf
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: count-perf
          path: counts/
          if-no-files-found: ignore
          retention-days: 1

  # REL-TECH-01 (ADR 0016) : test de fumée du VRAI binaire Windows. Build debug avec le front embarqué et l'identifiant de fumée
  # (tauri.smoke.conf.json), puis lancement du binaire, observation par CDP et capture des pixels réels de la fenêtre (tests/smoke).
  # Un écran noir au démarrage (2026-10-10) ne peut pas passer : le DOM seul ne suffit pas, les pixels sont contrôlés aussi.
  # REL-TECH-02 (audit 1.0 B15) : le même job construit l'installeur NSIS de fumée (produit « CircleTasks Smoke », identifiant .smoke, sans clé de
  # signature), contrôle le script NSIS généré (garde-fou, script absent = échec en CI), puis installe, réinstalle et désinstalle pour de vrai
  # (tests/smoke/pc-installeur.spec.ts) : la donnée témoin du dossier de données de fumée doit survivre. Aucun secret.
  smoke-windows:
    name: smoke Windows (binaire réel)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-report.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Cache des dépendances Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target/smoke
          shared-key: smoke-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build debug du binaire (front embarqué, identifiant de fumée)
        run: npm run test:smoke:build
      # Installeur NSIS de fumée : même configuration et même dossier cargo (target/smoke), donc aucune recompilation Rust ; le CLI télécharge NSIS.
      # Aucune clé de signature : createUpdaterArtifacts n'est activé nulle part dans la configuration de fumée.
      - name: Build de l'installeur NSIS de fumée
        id: nsis-build
        run: npm run test:smoke:installer-build
      # Garde-fou : le crochet NSIS_HOOK_PREUNINSTALL précède les RmDir /r de Section Uninstall ; en CI, un script absent est un échec.
      - name: Garde-fou du script NSIS généré
        run: npm run test:nsis -- --reporter=default --reporter=json --outputFile.json=vitest-nsis.json
      # S'exécute même si le garde-fou échoue (les deux niveaux, script généré et données réelles, sont toujours mesurés), mais pas si un build a échoué.
      - name: Test de fumée (CDP, pixels, installation, réinstallation et désinstallation)
        if: ${{ !cancelled() && steps.nsis-build.outcome == 'success' }}
        run: npm run test:smoke -- --reporter=github,html,json
      - name: Comptage
        if: ${{ !cancelled() && hashFiles('playwright-report.json') != '' }}
        shell: bash
        run: |
          mkdir -p "$CI_COUNTS"
          node scripts/ci/test-counts.mjs write playwright playwright-report.json "$CI_COUNTS/smoke-windows.json" "smoke Windows"
      - name: Comptage du garde-fou NSIS
        if: ${{ !cancelled() && hashFiles('vitest-nsis.json') != '' }}
        shell: bash
        run: |
          mkdir -p "$CI_COUNTS"
          node scripts/ci/test-counts.mjs write vitest vitest-nsis.json "$CI_COUNTS/smoke-nsis.json" "garde-fou NSIS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: smoke-windows
          path: |
            playwright-report/
            test-results/
            src-tauri/target/smoke/debug/nsis/x64/installer.nsi
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: count-smoke-windows
          path: counts/
          if-no-files-found: ignore
          retention-days: 1

  # Statut requis : vert seulement si tous les jobs sont verts. Résumé du nombre de tests par job.
  suite-verte:
    name: suite verte
    if: always()
    needs: [qualite, vitest-node, vitest-dom, vitest-couverture, cargo-test, audit-rust, e2e, e2e-webkit, perf, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: count-*
          path: counts
          merge-multiple: true
      - name: Résumé
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Suite CircleTasks"
            echo
            echo "| Job | Résultat |"
            echo "|---|---|"
            printf '%s' "$NEEDS" | node -e 'const n=JSON.parse(require("fs").readFileSync(0,"utf8"));for(const [k,v] of Object.entries(n))console.log(`| ${k} | ${v.result} |`)'
            echo
            echo "### Tests par job"
            echo
            if [ -d counts ]; then node scripts/ci/test-counts.mjs summary counts; else echo "Aucun comptage disponible."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Contrôle
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "Un job n'est pas vert ($RESULTS)"; exit 1; fi
          done
          echo "Suite verte"
