[package]
name = "tauri-plugin-speech"
version = "0.1.0"
description = "CircleTasks : dictée française sur l'appareil (SFSpeechRecognizer) et ouverture des Réglages (ADR 0015). Appelé par Rust seulement."
authors = ["Ali Cherif"]
edition = "2021"
rust-version = "1.80"
publish = false
# Exigé par tauri-plugin (nom identique au paquet) : le plugin Swift est lié par le script de compilation.
links = "tauri-plugin-speech"

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
