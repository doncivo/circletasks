[package]
name = "tauri-plugin-folder-bookmark"
version = "0.1.0"
description = "CircleTasks : signet de sécurité du dossier iCloud Drive/CircleTasks sur iPhone (ADR 0011 §22). Appelé par Rust seulement."
authors = ["Ali Cherif"]
edition = "2021"
rust-version = "1.80"
publish = false
# Exigé par tauri-plugin (nom identique au paquet) : le plugin Swift est lié par le script de compilation.
links = "tauri-plugin-folder-bookmark"

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
