[package]
name = "circletasks"
version = "0.1.0"
description = "CircleTasks : planificateur personnel (PC Windows et iPhone)"
authors = ["Ali Cherif"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# Nom distinct du binaire (conflit sous Windows) ; staticlib requis pour iOS.
name = "circletasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Les tests vivent dans tests/desktop (manifeste Windows comctl32 v6, voir build.rs) : un test
# unitaire lié à tauri ne démarre pas sous Windows (STATUS_ENTRYPOINT_NOT_FOUND).
test = false
doctest = false

[[bin]]
name = "circletasks"
path = "src/main.rs"
test = false

[[test]]
name = "desktop"
path = "tests/desktop/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
# Agendas externes (ADR 0008) : HTTP limité aux hôtes autorisés, PKCE, analyse d'URL.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["time", "net", "io-util"] }

# Coffre système : Gestionnaire d'identification Windows, Trousseau iOS (ADR 0008 section 3).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Capture rapide (Q-01, Q-04) : OCR Windows.Media.Ocr en flux mémoire, focus de l'application précédente.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Plugins PC uniquement (absents du build iOS).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# Export (H-03) : « Enregistrer sous » système et écriture du seul fichier choisi (le chemin retenu par la boîte entre dans le périmètre du plugin fs).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
# Test de sauvegarde avec un vrai WAL (même libsqlite3-sys 0.30 que sqlx).
tempfile = "3"
# Banc de test de la mise à jour (D-03) : clé jetable générée en mémoire, jamais écrite dans le dépôt.
tauri = { version = "2", features = ["test"] }
minisign = "0.7"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
# Installeur PC < 15 Mo (PRD section 8).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
