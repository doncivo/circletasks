[package]
name = "circletasks"
version = "0.1.1"
description = "CircleTasks : planificateur personnel (PC Windows et iPhone)"
authors = ["Ali Cherif"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# Nom distinct du binaire (conflit sous Windows) ; staticlib requis pour iOS.
name = "circletasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Les tests vivent dans tests/desktop (manifeste Windows comctl32 v6, voir build.rs) : un test
# unitaire lié à tauri ne démarre pas sous Windows (STATUS_ENTRYPOINT_NOT_FOUND).
test = false
doctest = false

[[bin]]
name = "circletasks"
path = "src/main.rs"
test = false

[[test]]
name = "desktop"
path = "tests/desktop/main.rs"
required-features = ["test-hooks"]

[features]
# Points d'arrêt simulés des tests (Y-11, revue 8) : jamais dans le binaire livré ; `cargo test --features test-hooks`.
test-hooks = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
# Agendas externes (ADR 0008) : HTTP limité aux hôtes autorisés, PKCE, analyse d'URL.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["time", "net", "io-util"] }
# Synchronisation (ADR 0011, Y-08) : AES-256-GCM et HKDF-SHA256 par aws-lc-rs, déjà compilée (fournisseur de rustls) ; tampons de clé effacés
# par zeroize. Fonctionnalités limitées à celles déjà actives : aucune nouvelle entrée dans Cargo.lock.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "alloc"] }
zeroize = "1"

# Coffre système : Gestionnaire d'identification Windows, Trousseau iOS (ADR 0008 section 3).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Capture rapide (Q-01, Q-04) : OCR Windows.Media.Ocr en flux mémoire, focus de l'application précédente.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Time", "Win32_System_Com", "Win32_UI_WindowsAndMessaging",
    # Synchro (ADR 0011, sections 2.1 et 6) : contrôle du dossier, fichiers ouverts par handle, iCloud (cfapi), confirmation native.
    "Win32_Security", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_UI_Controls", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
# Fenêtre pairing (Y-06, audit 1) : réglages de la WebView2 (menu contextuel, raccourcis, remplissage automatique). Même version que
# celle déjà compilée par Tauri (wry) : aucune nouvelle entrée dans Cargo.lock.
webview2-com = "0.39"
[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# Clé de synchro au Trousseau avec kSecAttrAccessibleWhenUnlockedThisDeviceOnly et non synchronisée (ADR 0011 section 2.2, vault_ios.rs) :
# keyring ne règle pas ces attributs. Même version que celle déjà tirée par keyring.
security-framework = { version = "3", default-features = false }
# Rappels (N-01, ADR 0012 avenant lot N1 section N1.1) : notifications locales iOS seulement, version ÉPINGLÉE (les constats 7 à 12 de
# l'avenant lisent son code Swift ; toute montée exige une relecture et un avenant). Jamais sous cfg(desktop) : le PC n'envoie aucune
# notification de rappel (consistency.test.ts, tests/desktop/config.rs et l'étape « Plugins iOS » de build-ios.yml le vérifient).
tauri-plugin-notification = "=2.5.1"
# Signet de sécurité du dossier iCloud Drive/CircleTasks et accès aux fichiers (ADR 0011 §22, Y-IOS-01) : plugin Swift local, appelé par Rust seul.
tauri-plugin-folder-bookmark = { path = "plugins/folder-bookmark" }
# Scan du QR d'association (ADR 0011 §23 point 2, Y-IOS-02) : API du JS seulement (aucune API Rust publique), texte passé aussitôt à
# sync_key_import. Version exacte relue (2.5.1, revue audit), alignée sur @tauri-apps/plugin-barcode-scanner ~2.5.1 ; relire le code
# (API Rust, permissions) à chaque montée de version.
tauri-plugin-barcode-scanner = "=2.5.1"
# Verrouillage par Face ID ou code de l'iPhone (I-03, ADR 0013 §2.1) : version ÉPINGLÉE (les constats 3 à 6 de l'ADR lisent son code Swift ;
# toute montée exige une relecture et un avenant). iOS seulement ; aucune commande Rust, permissions accordées par biometric-ios.json.
tauri-plugin-biometric = "=2.4.1"
# Retour haptique (A-07, ADR 0013 §1.1) : plugin Swift local (générateurs UIKit sur le fil principal), nom Tauri « haptics ».
tauri-plugin-ct-haptics = { path = "plugins/haptics" }
# Cache de confidentialité natif (I-03, ADR 0013 §2.5, décision d'Ali du 2026-10-08) : vue opaque quand l'app devient inactive.
tauri-plugin-privacy-shield = { path = "plugins/privacy-shield" }

# Fuseau local de la boîte « Oublier cet appareil » (ADR 0011 §23 point 4) : localtime_r. Même version que celle déjà tirée.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Plugins PC uniquement (absents du build iOS).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# Export (H-03) : « Enregistrer sous » système, ouvert et écrit par Rust (src/export.rs) ; la WebView n'a ni dialog ni fs.
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
# Test de sauvegarde avec un vrai WAL (même libsqlite3-sys 0.30 que sqlx).
tempfile = "3"
# Banc de test de la mise à jour (D-03) : clé jetable générée en mémoire, jamais écrite dans le dépôt.
tauri = { version = "2", features = ["test"] }
minisign = "0.7"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
# Installeur PC < 15 Mo (PRD section 8).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
