[package]
name = "circletasks"
version = "0.1.0"
description = "CircleTasks : planificateur personnel (PC Windows et iPhone)"
authors = ["Ali Cherif"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# Nom distinct du binaire (conflit sous Windows) ; staticlib requis pour iOS.
name = "circletasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Installeur PC < 15 Mo (PRD section 8).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
