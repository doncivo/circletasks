<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>iPhone — Routine tous les N jours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;color:#2E2150;background:#FFFFFF}
a{color:#2E2150}a:hover{color:#4A3A7A}
.tab{display:flex;align-items:center;justify-content:center;height:112px;border-radius:0 16px 16px 0;text-decoration:none;color:#2E2150;margin-right:6px}
.tab span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:15px;letter-spacing:0.02em}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:#2E2150;padding:0;cursor:pointer}
.pill{height:32px;padding:0 14px;border-radius:16px;font:600 13px "DM Sans",sans-serif;background:#FFFFFF;cursor:pointer}
.lbl{font-size:15px;font-weight:700;padding-bottom:4px;border-bottom:2px solid #2E2150;align-self:flex-start}
.seg{flex-grow:1;height:38px;border:0;border-radius:10px;font:600 14px "DM Sans",sans-serif;background:transparent;color:#2E2150;cursor:pointer}
.ic{width:52px;height:52px;border-radius:26px;border:1.5px solid #E6E2EE;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;cursor:pointer}
.rad{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;background:transparent;border:0;color:#2E2150;padding:0;cursor:pointer}
.dot{width:22px;height:22px;border-radius:11px;border:2px solid #2E2150;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.box{width:22px;height:22px;border-radius:6px;border:2px solid #2E2150;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.wl{display:flex;flex-direction:column;align-items:center}
.wl span{height:32px;display:flex;align-items:center;font-size:17px;color:#8E87A3}
.d{width:40px;height:40px;border-radius:20px;border:1.5px solid #D9776B;color:#9E3F33;background:#FFFFFF;font:700 14px "DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.d.on{background:#F2A7A0;border-color:#F2A7A0;color:#2E2150}
.fld{width:100%;height:54px;border:0;border-radius:14px;background:#F3F1F6;padding:0 16px;font:600 18px "DM Sans",sans-serif;color:#2E2150;box-sizing:border-box}

</style>
</head>
<body>
<div style="width: 440px; height: 956px; background: #6E6687; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;">
<section aria-label="Modifier la routine" style="height: 916px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 28px 20px; box-sizing: border-box;">
<div style="display: flex; align-items: center; justify-content: space-between;"><h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 700;">Modifier la routine</h1><a class="ib" href="Routines.html" aria-label="Fermer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a></div>
<label style="display: flex;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Nom de la routine</span><input class="fld" value="Séance d'étirements"></label>
<div style="display: flex; gap: 20px;"><button class="rad" aria-pressed="true"><span class="dot"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2E2150;"></span></span><span style="font-weight: 700;">Icône</span></button><button class="rad"><span class="dot"></span>Emoji</button></div>
<div style="display: flex; gap: 10px;"><button class="ic" aria-label="Icône sport" style="border: 2.5px solid #2E2150;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B43A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5v5M6.5 7.5v9M17.5 7.5v9M20.5 9.5v5M6.5 12h11"></path></svg></button><button class="ic" aria-label="Icône soleil"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B9770E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 7v2M5.5 10.5l1.4 1.4M18.5 10.5l-1.4 1.4"></path></svg></button><button class="ic" aria-label="Icône verre d'eau"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A7AB8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l-1.6 16H7.6z"></path><path d="M7 10.5h10"></path></svg></button><button class="ic" aria-label="Icône livre"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3E7C5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5V5.5"></path></svg></button><button class="ic" aria-label="Icône gâteau"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B5483B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16v-7H4z"></path><path d="M4 15.5c2 1.3 4 1.3 6 0s4-1.3 6 0 3 1 4 .5M12 13V9"></path></svg></button><button class="ic" aria-label="Icône calendrier"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F6698" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></button></div>
<span class="lbl">Fréquence</span>
<button aria-label="Fréquence" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border: 1.5px solid #D9D4E4; border-radius: 12px; background: #FFFFFF; color: #2E2150; font: 600 16px 'DM Sans', sans-serif; cursor: pointer;"><span><span style="color: #5E557A; font-weight: 500;">Fréquence : </span>Tous les N jours</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #F3F1F6;">
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px;">
<span style="font-size: 16px; font-weight: 600;">Tous les</span>
<button aria-label="Diminuer" style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid #D9D4E4; background: #FFFFFF; color: #2E2150; font: 700 22px 'DM Sans', sans-serif; cursor: pointer;">−</button>
<span style="min-width: 36px; text-align: center; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 700;">3</span>
<button aria-label="Augmenter" style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid #D9D4E4; background: #FFFFFF; color: #2E2150; font: 700 22px 'DM Sans', sans-serif; cursor: pointer;">+</button>
<div style="display: flex; gap: 4px; padding: 4px; background: #FFFFFF; border-radius: 10px;"><button aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #2E2150; color: #FFFFFF; font: 600 14px 'DM Sans', sans-serif; cursor: pointer;">jours</button><button style="height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #2E2150; font: 600 14px 'DM Sans', sans-serif; cursor: pointer;">semaines</button></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px;"><span style="font-weight: 600;">À partir du</span><span style="font-weight: 700;">Lun. 21 sept.</span></div>
<span style="font-size: 14px; color: #5E557A;">Prochaines fois : jeu. 24, dim. 27, mer. 30 sept., sam. 3 oct.</span>
</div>
<span class="lbl">Heure et rappel</span>
<div style="display: flex; align-items: center; gap: 16px;">
<button style="height: 46px; padding: 0 18px; border: 1.5px solid #D9D4E4; border-radius: 12px; background: #FFFFFF; color: #2E2150; font: 700 20px 'DM Sans', sans-serif; cursor: pointer;">18:00</button>
<button class="rad" aria-pressed="true"><span class="box" style="background: #2E2150;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>À l'heure</button><button class="rad"><span class="box"></span>30 min</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 15px; font-weight: 600;">Espace</span><div style="display: flex; gap: 4px; padding: 4px; background: #F3F1F6; border-radius: 12px;"><button class="seg" style="flex-grow: 0; padding: 0 16px; color: #2F6B7A;">Pro</button><button class="seg" aria-pressed="true" style="flex-grow: 0; padding: 0 16px; background: #FFFFFF; color: #B5483B; box-shadow: 0 1px 3px rgba(46,33,80,0.15);">Perso</button></div></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 0;"><span style="display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 600;">Mettre en pause</span><span style="font-size: 13px; color: #5E557A;">Aucune occurrence tant que la pause dure</span></span><button aria-label="Mettre en pause" aria-pressed="false" style="width: 56px; height: 32px; border-radius: 16px; background: #DDD9E4; border: 0; display: flex; align-items: center; padding: 3px; cursor: pointer;"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF;"></span></button></div>
<div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F3F1F6; font-size: 14px;"><span style="flex-grow: 1;">Série en cours <b>4 séances</b></span><span>Meilleure <b>11</b></span></div>
<div style="flex-grow: 1;"></div>
<div style="display: flex; gap: 10px;">
<button style="height: 56px; padding: 0 20px; border: 0; border-radius: 28px; background: transparent; color: #A1271C; font: 700 16px 'DM Sans', sans-serif; cursor: pointer;">Archiver</button>
<button style="flex-grow: 1; height: 56px; border: 0; border-radius: 28px; background: #3A2A66; color: #FFFFFF; font: 700 17px 'DM Sans', sans-serif; cursor: pointer;">Enregistrer</button>
</div>
</section>
</div>
</body>
</html>
