<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>iPhone — Nouvelle tâche</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;color:#2E2150;background:#FFFFFF}
a{color:#2E2150}a:hover{color:#4A3A7A}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:#2E2150;padding:0;cursor:pointer}
.lbl{font-size:15px;font-weight:700;padding-bottom:4px;border-bottom:2px solid #2E2150;align-self:flex-start}
.seg{flex-grow:1;height:38px;border:0;border-radius:10px;font:600 14px "DM Sans",sans-serif;background:transparent;color:#2E2150;cursor:pointer}
.ic{width:52px;height:52px;border-radius:26px;border:1.5px solid #E6E2EE;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;cursor:pointer}
.rad{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;background:transparent;border:0;color:#2E2150;padding:0;cursor:pointer}
.dot{width:22px;height:22px;border-radius:11px;border:2px solid #2E2150;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.box{width:22px;height:22px;border-radius:6px;border:2px solid #2E2150;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.wl{display:flex;flex-direction:column;align-items:center;gap:0}
.wl span{height:32px;display:flex;align-items:center;font-size:17px;color:#8E87A3}
</style>
</head>
<body>
<div style="width: 440px; height: 956px; background: #6E6687; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;">
<section aria-label="Nouvelle tâche" style="height: 916px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 28px 20px; box-sizing: border-box;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 700;">Nouvelle tâche</h1>
<a class="ib" href="Main.html" aria-label="Fermer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; gap: 4px; padding: 4px; background: #F3F1F6; border-radius: 12px;">
<button class="seg" aria-pressed="true" style="background: #FFFFFF; box-shadow: 0 1px 3px rgba(46,33,80,0.15);">Tâche</button>
<button class="seg">Événement</button>
<button class="seg">Routine</button>
</div>
<label style="display: flex;">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Titre</span>
<input type="text" value="Appeler le notaire" style="width: 100%; height: 54px; border: 0; border-radius: 14px; background: #F3F1F6; padding: 0 16px; font: 600 18px 'DM Sans', sans-serif; color: #2E2150; box-sizing: border-box;">
</label>
<div style="display: flex; gap: 20px;">
<button class="rad" aria-pressed="true"><span class="dot"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2E2150;"></span></span><span style="font-weight: 700;">Icône</span></button>
<button class="rad"><span class="dot"></span>Emoji</button>
</div>
<div style="display: flex; gap: 10px;">
<button class="ic" aria-label="Icône téléphone, choisie" style="border: 2.5px solid #2E2150;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3E7C5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5c0 8 6.5 14.5 14.5 14.5l1-3.5-4-1.8-2 2a11 11 0 0 1-5.2-5.2l2-2-1.8-4z"></path></svg></button>
<button class="ic" aria-label="Icône document"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B5483B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v4h4M10 12h5M10 16h5"></path></svg></button>
<button class="ic" aria-label="Icône calendrier"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F6698" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></button>
<button class="ic" aria-label="Icône sport"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B43A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5v5M6.5 7.5v9M17.5 7.5v9M20.5 9.5v5M6.5 12h11"></path></svg></button>
<button class="ic" aria-label="Icône livre"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3E7C5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5V5.5"></path></svg></button>
<button class="ic" aria-label="Icône verre d'eau"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A7AB8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l-1.6 16H7.6z"></path><path d="M7 10.5h10"></path></svg></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between;"><span class="lbl">Date</span><div style="display: flex; gap: 6px;"><button style="height: 28px; padding: 0 10px; border: 1.5px solid #2E2150; border-radius: 14px; background: #2E2150; color: #FFFFFF; font: 600 12px 'DM Sans', sans-serif; cursor: pointer;">Aujourd'hui</button><button style="height: 28px; padding: 0 10px; border: 1.5px solid #D9D4E4; border-radius: 14px; background: #FFFFFF; color: #2E2150; font: 600 12px 'DM Sans', sans-serif; cursor: pointer;">Demain</button><button style="height: 28px; padding: 0 10px; border: 1.5px solid #D9D4E4; border-radius: 14px; background: #FFFFFF; color: #2E2150; font: 600 12px 'DM Sans', sans-serif; cursor: pointer;">Un jour</button></div></div>
<div style="position: relative; display: flex; justify-content: center; gap: 36px; padding: 0 12px; border-radius: 14px;">
<div style="position: absolute; left: 0px; right: 0px; top: 64px; height: 32px; border: 1.5px solid #2E2150; border-radius: 10px; background: #F3F1F6;"></div>
<div class="wl" style="position: relative;"><span>Lun. 21 sept.</span><span>Mar. 22 sept.</span><span style="color: #2E2150; font-weight: 700;">Aujourd'hui</span><span>Jeu. 24 sept.</span><span>Ven. 25 sept.</span></div>
<div class="wl" style="position: relative;"><span>12</span><span>13</span><span style="color: #2E2150; font-weight: 700;">14</span><span>15</span><span>16</span></div>
<div class="wl" style="position: relative;"><span>50</span><span>55</span><span style="color: #2E2150; font-weight: 700;">00</span><span>05</span><span>10</span></div>
</div>
<span class="lbl">Répétition</span>
<div style="display: flex; justify-content: space-between;">
<button class="rad" aria-pressed="true"><span class="dot"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2E2150;"></span></span>Une fois</button>
<button class="rad"><span class="dot"></span>Hebdo</button>
<button class="rad"><span class="dot"></span>Mensuel</button>
<button class="rad"><span class="dot"></span>Annuel</button>
</div>
<button style="align-self: flex-start; border: 0; background: transparent; padding: 0; color: #5B43A8; font: 600 13px 'DM Sans', sans-serif; text-decoration: underline; cursor: pointer;">Autre : tous les N jours, Nᵉ jour du mois, date de fin…</button>
<span class="lbl">Rappel</span>
<div style="display: flex; justify-content: space-between; align-items: center;">
<button class="rad" aria-pressed="true"><span class="box" style="background: #2E2150;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>À l'heure</button>
<button class="rad"><span class="box"></span>30 min</button>
<button class="rad"><span class="box"></span>1 heure</button>
<button class="rad" style="font-weight: 700; text-decoration: underline;">Plus…</button>
</div>
<div style="display: flex; gap: 10px;">
<div style="display: flex; gap: 4px; padding: 4px; background: #F3F1F6; border-radius: 12px;">
<button class="seg" aria-pressed="true" style="flex-grow: 0; padding: 0 16px; background: #FFFFFF; color: #2F6B7A; box-shadow: 0 1px 3px rgba(46,33,80,0.15);">Pro</button>
<button class="seg" style="flex-grow: 0; padding: 0 16px; color: #B5483B;">Perso</button>
</div>
<button style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 14px; border: 1.5px solid #D9D4E4; border-radius: 12px; background: #FFFFFF; color: #2E2150; font: 600 15px 'DM Sans', sans-serif; cursor: pointer;">Projet : aucun<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 0;">
<span style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3F7FC4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.2"></circle></svg>Rattacher à mon objectif</span>
<button aria-label="Rattacher à mon objectif" aria-pressed="false" style="width: 56px; height: 32px; border-radius: 16px; background: #DDD9E4; border: 0; display: flex; align-items: center; padding: 3px; cursor: pointer;"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF;"></span></button>
</div>
<div style="flex-grow: 1;"></div>
<button style="height: 56px; border: 0; border-radius: 28px; background: #3A2A66; color: #FFFFFF; font: 700 17px 'DM Sans', sans-serif; cursor: pointer;">Enregistrer</button>
</section>
</div>
</body>
</html>
