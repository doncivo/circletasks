<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>iPhone — Focus Time</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;color:#FFFFFF;background:#2E2150}
a{color:#FFFFFF}a:hover{color:#E6E0F5}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:#FFFFFF;padding:0;cursor:pointer}
.ch{height:38px;padding:0 16px;border-radius:19px;border:1.5px solid #6E6396;background:transparent;color:#FFFFFF;font:600 14px "DM Sans",sans-serif;cursor:pointer}
</style>
</head>
<body>
<div style="width: 440px; height: 956px; background: #2E2150; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 56px 28px 40px 28px; box-sizing: border-box; overflow: hidden;">
<div style="align-self: stretch; display: flex; align-items: center; justify-content: space-between;">
<a class="ib" href="Main.html" aria-label="Fermer Focus"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #C9BEE6;">FOCUS TIME</span>
<span style="width: 44px;"></span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 12px;">
<span style="font-size: 14px; font-weight: 600; color: #C9BEE6;">09:00 · <span style="color: #9FD0DC;">Pro</span></span>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 36px; font-weight: 700; text-align: center;">Envoyer la facture</h1>
</div>
<div style="position: relative; width: 300px; height: 300px; margin-top: 16px;">
<svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="130" fill="none" stroke="#45386B" stroke-width="14"></circle><circle cx="150" cy="150" r="130" fill="none" stroke="#F2A7A0" stroke-width="14" stroke-linecap="round" stroke-dasharray="816.8" stroke-dashoffset="307" transform="rotate(-90 150 150)"></circle></svg>
<div style="position: absolute; left: 0px; top: 0px; width: 300px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
<span style="font-family: Fraunces, Georgia, serif; font-size: 72px; font-weight: 600; line-height: 1;">15:34</span>
<span style="font-size: 15px; color: #C9BEE6;">restantes sur 25 min</span>
</div>
</div>
<div style="display: flex; gap: 10px;">
<button class="ch" aria-pressed="true" style="background: #FFFFFF; color: #2E2150; border-color: #FFFFFF;">25 min</button>
<button class="ch">50 min</button>
<button class="ch">90 min</button>
<button class="ch">Libre</button>
</div>
<div style="flex-grow: 1;"></div>
<div style="align-self: stretch; display: flex; gap: 12px;">
<button style="flex-grow: 1; height: 58px; border: 2px solid #FFFFFF; border-radius: 29px; background: transparent; color: #FFFFFF; font: 700 17px 'DM Sans', sans-serif; cursor: pointer;">Pause</button>
<button style="flex-grow: 1; height: 58px; border: 0; border-radius: 29px; background: #F2A7A0; color: #2E2150; font: 700 17px 'DM Sans', sans-serif; cursor: pointer;">Terminer la tâche</button>
</div>
<span style="font-size: 14px; color: #C9BEE6;">Aujourd'hui : 1 h 15 de concentration · 3 sessions</span>
</div>
</body>
</html>
