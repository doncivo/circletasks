<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>iPhone — Checklists</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;color:#2E2150;background:#FFFFFF}
a{color:#2E2150}
.tab{display:flex;align-items:center;justify-content:center;height:112px;border-radius:0 16px 16px 0;text-decoration:none;color:#2E2150;margin-right:6px}
.tab span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:15px;letter-spacing:0.02em}
.it{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #EFECF5;font-size:17px;font-weight:600}
.cb{width:25px;height:25px;border:2px solid #2E2150;border-radius:8px;background:#FFFFFF;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.it.done .cb{background:#2E2150}
.it.done span{color:#B5AEC6;font-weight:500;text-decoration:line-through}
.ta{border:0;background:transparent;font:600 15px "DM Sans",sans-serif;cursor:pointer;padding:0;height:40px}
</style>
</head>
<body>
<div style="width: 440px; height: 956px; display: flex; background: #FFFFFF; overflow: hidden;">

<nav aria-label="Navigation principale" style="width: 64px; height: 956px; flex-shrink: 0; background: #2E2150; display: flex; flex-direction: column; gap: 6px; padding: 64px 0 28px 0; box-sizing: border-box;">
<a class="tab" href="Jour.html" style="background: #B9C8A3;"><span>Tâches</span></a>
<a class="tab" href="Semaine-v2.html" style="background: #C9BEE6;"><span>Semaine</span></a>
<a class="tab" href="Routines-v2.html" style="background: #F2A7A0;"><span>Routines</span></a>
<a class="tab" href="Evenements-v2.html" style="background: #9DBBC9;"><span>Événements</span></a>
<a class="tab" href="Checklists-v2.html" aria-current="page" style="background: #FFFFFF; margin-right: 0px;"><span>Checklists</span></a>
<div style="flex-grow: 1;"></div>
<a class="tab" href="Reglages-v3.html" style="background: #CFCFD4;"><span>Réglages</span></a>
</nav>

<main style="flex-grow: 1; height: 956px; display: flex; flex-direction: column; box-sizing: border-box;">
  <div style="height: 56px; flex-shrink: 0;"></div>
  <div style="padding: 0 20px; flex-grow: 1; overflow: hidden;">

  <!-- Le sélecteur EST le titre : le nom n'apparaît qu'une fois -->
  <button style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; width: 100%;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B9770E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M4 11l8-7 8 7v9H4z"></path><path d="M10 20v-5h4v5"></path></svg>
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 36px; line-height: 1; font-weight: 700;">Course maison</h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8C85A3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>

  <div style="display: flex; align-items: center; gap: 13px; margin-top: 15px;">
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #EFECF5; overflow: hidden;">
      <div style="width: 66%; height: 6px; background: #2E2150;"></div>
    </div>
    <span style="font-size: 14px; font-weight: 700; color: #6F6790; font-variant-numeric: tabular-nums;">2 sur 3</span>
  </div>

  <div style="margin-top: 16px;">
    <div class="it done"><button class="cb" aria-label="Décocher : Carotte" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button><span>Carotte</span></div>
    <div class="it done"><button class="cb" aria-label="Décocher : Mangue" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button><span>Mangue</span></div>
    <div class="it"><button class="cb" aria-label="Cocher : Banane"></button><span>Banane</span></div>
  </div>

  <!-- Un seul moyen d'ajouter -->
  <label style="display: block; margin-top: 14px;">
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Nouvel élément</span>
    <input type="text" placeholder="Ajouter un élément" style="width: 100%; height: 50px; border: 1.5px solid #E8E4F0; border-radius: 25px; background: #FFFFFF; padding: 0 18px; font: 500 16px 'DM Sans', sans-serif; color: #2E2150; box-sizing: border-box;">
  </label>

  </div>

  <!-- Libellés sans ambiguïté, compte inclus, rouge seulement quand c'est actif -->
  <div style="padding: 13px 20px 20px 20px; border-top: 1px solid #E8E4F0; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <button class="ta" style="color: #B5483B;">Supprimer les 2 éléments cochés</button>
    <button class="ta" style="color: #2E2150;">Tout décocher</button>
  </div>
</main>
</div>
</body>
</html>
